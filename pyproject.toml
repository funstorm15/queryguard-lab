[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard-lab"
version = "0.2.0"
description = "A reproducible security lab for LLM-powered SQL applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["llm", "sql", "prompt-injection", "security", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
queryguard = "queryguard.cli:main"

[tool.setuptools.packages.find]
include = ["queryguard*"]

[tool.setuptools.package-data]
queryguard = ["static/*.html", "static/*.css", "static/*.js"]
